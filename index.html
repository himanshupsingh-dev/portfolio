<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.workers.dev http://localhost:8787; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" />
  <title>Himanshu Pratap Singh — Software Developer</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f8ef7'/%3E%3Cstop offset='1' stop-color='%23a78bfa'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ctext x='16' y='23' font-family='Inter,Arial,sans-serif' font-size='19' font-weight='900' fill='white' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" crossorigin="anonymous" />
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/visual.css">
  <link rel="stylesheet" href="css/ai-agent.css">
</head>
<body>
  <!-- Page Loader -->
  <div id="page-loader">
    <div class="pl-wrap">
      <div class="pl-logo">
        <div class="pl-h">H</div>
        <div class="pl-spinner"></div>
      </div>
      <div class="pl-name">Himanshu<span>.</span></div>
      <div class="pl-track"><div id="pl-fill" class="pl-fill"></div></div>
      <div id="pl-label" class="pl-label">Loading…</div>
    </div>
  </div>

  <!-- Scroll Progress Bar -->
  <div id="scroll-progress"></div>

  <!-- Cursor Elements -->
  <div class="cursor-dot"></div>
  <div class="cursor-ring"></div>

  <!-- Navigation -->
  <nav id="navbar">
    <div class="nav-logo" id="nav-logo"></div>
    <ul class="nav-links" id="navlinks"></ul>
    <div class="hamburger" onclick="toggleMenu()">
      <span></span><span></span><span></span>
    </div>
  </nav>

  <!-- Hero Section -->
  <section id="hero">
    <div class="hero-left" id="hero-left"></div>
    <div class="hero-right" id="hero-right">
      <div class="scroll-down"></div>
    </div>
  </section>

  <!-- About Section -->
  <section id="about">
    <div class="section-inner" id="about-inner"></div>
  </section>

  <!-- Skills Section -->
  <section id="skills">
    <div class="section-inner" id="skills-inner"></div>
  </section>

  <!-- Experience Section -->
  <section id="experience">
    <div class="section-inner" id="experience-inner"></div>
  </section>

  <!-- Work Section -->
  <section id="work">
    <div class="section-inner" id="work-inner"></div>
  </section>

  <!-- Certs Section -->
  <section id="certs">
    <div class="section-inner" id="certs-inner"></div>
  </section>

  <!-- Contact Section -->
  <section id="contact">
    <div class="section-inner" id="contact-inner"></div>
  </section>

  <!-- Footer -->
  <footer id="site-footer"></footer>

  <!-- Floating Action Dock -->
  <div class="dock">
    <button class="dock-btn" id="dock-theme" data-tooltip="Change Color Theme">🎨</button>
    <button class="dock-btn" id="dock-resume" data-tooltip="Download My Resume">⬇️</button>
    <button class="dock-btn" id="dock-shortcuts" data-tooltip="Keyboard Shortcuts">❓</button>
    <button class="dock-btn" id="dock-ai" data-tooltip="Himanshu's AI">🤖</button>
  </div>

  <!-- Theme Popover -->
  <div class="theme-pop" id="theme-pop">
    <h5>Choose Theme</h5>
    <div class="theme-list" id="theme-list"></div>
  </div>

  <!-- Project Modal -->
  <div id="project-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-banner" id="modal-banner"></div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- Shortcuts Overlay -->
  <div id="shortcuts-overlay" class="shortcuts-overlay">
    <div class="shortcuts-card" id="shortcuts-card"></div>
  </div>

  <!-- AI Chat Panel -->
  <div id="ai-chat-panel">
    <div class="ai-chat-header">
      <div class="ai-chat-title">
        <span class="ai-chat-icon">🤖</span>
        <div>
          <div class="ai-chat-name">Himanshu's AI</div>
          <div class="ai-chat-sub"><span class="ai-online-dot"></span>Always available</div>
        </div>
      </div>
      <button id="ai-close-btn" class="ai-close-btn" title="Close">×</button>
    </div>
    <div id="ai-messages" class="ai-messages"></div>
    <div class="ai-chat-footer">
      <div class="ai-counter-wrap">
        <span id="ai-msg-counter" class="ai-msg-counter">0/15 messages</span>
      </div>
      <div class="ai-input-wrap">
        <textarea id="ai-msg-input" class="ai-msg-input"
          placeholder="Ask about skills, projects, experience…"
          rows="1" maxlength="500"></textarea>
        <button id="ai-send-btn" class="ai-send-btn" title="Send (Enter)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notifications -->
  <div id="toast-wrap" class="toast-wrap"></div>

  <!-- Confetti Canvas -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Section Background Canvases -->
  <canvas id="particles-bg"></canvas>
  <canvas id="about-bg"></canvas>
  <canvas id="skills-bg"></canvas>
  <canvas id="experience-bg"></canvas>
  <canvas id="work-bg"></canvas>
  <canvas id="certs-bg"></canvas>
  <canvas id="contact-bg"></canvas>

  <!-- Scroll to Top Button -->
  <button id="scrolltop" title="Back to top">↑</button>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/interactions.js"></script>
  <script src="js/interactive.js"></script>
  <script src="js/visual.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/ai-agent.js"></script>
</body>
</html>
