<!DOCTYPE html>
<html lang="en">
<head>

  <title>Himanshu Pratap Singh — Software Developer</title>
  <meta name="description" content="Himanshu Pratap Singh — Senior Software Developer with 3+ years building full-stack web applications across healthcare, IoT, and enterprise domains. Specialises in Angular, React, Node.js, and AI integrations at EY." />
  <meta property="og:title" content="Himanshu Pratap Singh — Software Developer" />
  <meta property="og:description" content="Senior Software Developer · Full Stack · AI Integrations. Building impactful web applications for healthcare, IoT, and enterprise clients." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="photo.jpeg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Himanshu Pratap Singh — Software Developer" />
  <meta name="twitter:description" content="Senior Software Developer · Angular · React · Node.js · AI Integrations." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f8ef7'/%3E%3Cstop offset='1' stop-color='%23a78bfa'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ctext x='16' y='23' font-family='Inter,Arial,sans-serif' font-size='19' font-weight='900' fill='white' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" crossorigin="anonymous" />
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/visual.css">
  <link rel="stylesheet" href="css/ai-agent.css">
</head>
<body>
  <noscript>
    <div style="position:fixed;inset:0;background:#0b0f1a;color:#f0f4ff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;text-align:center;padding:2rem;z-index:99999;">
      <div style="font-size:2rem;margin-bottom:1rem;">⚡</div>
      <h1 style="font-size:1.4rem;margin-bottom:0.75rem;">JavaScript Required</h1>
      <p style="color:#8892a4;max-width:400px;">This portfolio uses JavaScript to render content. Please enable it in your browser settings to view the site.</p>
      <p style="margin-top:1.5rem;color:#8892a4;">In the meantime, reach me at <a href="mailto:himanshupsingh47@gmail.com" style="color:#4f8ef7;">himanshupsingh47@gmail.com</a></p>
    </div>
  </noscript>
  <!-- Page Loader -->
  <div id="page-loader">
    <div class="pl-wrap">
      <div class="pl-logo">
        <div class="pl-h">H</div>
        <div class="pl-spinner"></div>
      </div>
      <div class="pl-name">Himanshu<span>.</span></div>
      <div class="pl-track"><div id="pl-fill" class="pl-fill"></div></div>
      <div id="pl-label" class="pl-label">Loading…</div>
    </div>
  </div>

  <!-- Navigation -->
  <nav id="navbar">
    <div class="nav-logo" id="nav-logo"></div>
    <ul class="nav-links" id="navlinks"></ul>
    <div class="hamburger" onclick="toggleMenu()">
      <span></span><span></span><span></span>
    </div>
  </nav>

  <!-- Hero Section -->
  <section id="hero">
    <div class="hero-left" id="hero-left"></div>
    <div class="hero-right" id="hero-right">
      <div class="scroll-down"></div>
    </div>
  </section>

  <!-- About Section -->
  <section id="about">
    <div class="section-inner" id="about-inner"></div>
  </section>

  <!-- Skills Section -->
  <section id="skills">
    <div class="section-inner" id="skills-inner"></div>
  </section>

  <!-- Experience Section -->
  <section id="experience">
    <div class="section-inner" id="experience-inner"></div>
  </section>

  <!-- Work Section -->
  <section id="work">
    <div class="section-inner" id="work-inner"></div>
  </section>

  <!-- Certs Section -->
  <section id="certs">
    <div class="section-inner" id="certs-inner"></div>
  </section>

  <!-- Contact Section -->
  <section id="contact">
    <div class="section-inner" id="contact-inner"></div>
  </section>

  <!-- Footer -->
  <footer id="site-footer"></footer>

  <!-- Floating Action Dock -->
  <div class="dock">
    <button class="dock-btn" id="dock-theme" data-tooltip="Change Color Theme">🎨</button>
    <button class="dock-btn" id="dock-resume" data-tooltip="Download My Resume">⬇️</button>
    <button class="dock-btn" id="dock-shortcuts" data-tooltip="Keyboard Shortcuts">❓</button>
  </div>

  <!-- Floating AI Avatar -->
  <div class="ai-avatar-float" id="ai-avatar-float">
    <div class="ai-avatar-bubble" id="ai-avatar-bubble">
      <div class="ai-avatar-bubble-hdr">
        <div class="ai-avatar-mini-bot" id="ai-avatar-mini-bot"></div>
        <div class="ai-avatar-bubble-meta">
          <span class="ai-avatar-bubble-hname">Himanshu's AI</span>
          <div class="ai-avatar-bubble-status">
            <span class="ai-online-dot"></span>Online · always available
          </div>
        </div>
        <button class="ai-avatar-bubble-close" id="ai-bubble-close" title="Dismiss">×</button>
      </div>
      <p class="ai-avatar-bubble-text">Hey! 👋 Ask me anything about Himanshu's skills, projects, or whether he's available to hire.</p>
      <div class="ai-avatar-bubble-chips">
        <button class="ai-avatar-chip" data-question="What is Himanshu's tech stack?">Tech stack</button>
        <button class="ai-avatar-chip" data-question="Is Himanshu open to new opportunities?">Open to work?</button>
        <button class="ai-avatar-chip" data-question="Tell me about his best projects">Top projects</button>
      </div>
    </div>
    <button class="ai-avatar-btn" id="ai-avatar-btn" title="Chat with Himanshu's AI" aria-label="Chat with Himanshu's AI"></button>
  </div>

  <!-- Theme Popover -->
  <div class="theme-pop" id="theme-pop">
    <h5>Choose Theme</h5>
    <div class="theme-list" id="theme-list"></div>
  </div>

  <!-- Project Modal -->
  <div id="project-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-banner" id="modal-banner"></div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- Shortcuts Overlay -->
  <div id="shortcuts-overlay" class="shortcuts-overlay">
    <div class="shortcuts-card" id="shortcuts-card"></div>
  </div>

  <!-- AI Chat Panel -->
  <div id="ai-chat-panel">
    <div class="ai-chat-header">
      <div class="ai-chat-title">
        <span class="ai-chat-icon">🤖</span>
        <div>
          <div class="ai-chat-name">Himanshu's AI</div>
          <div class="ai-chat-sub"><span class="ai-online-dot"></span>Always available</div>
        </div>
      </div>
      <button id="ai-close-btn" class="ai-close-btn" title="Close">×</button>
    </div>
    <div id="ai-messages" class="ai-messages"></div>
    <div class="ai-chat-footer">
      <div class="ai-counter-wrap">
        <span id="ai-msg-counter" class="ai-msg-counter">0/15 messages</span>
      </div>
      <div class="ai-input-wrap">
        <textarea id="ai-msg-input" class="ai-msg-input"
          placeholder="Ask about skills, projects, experience…"
          rows="1" maxlength="500"></textarea>
        <button id="ai-send-btn" class="ai-send-btn" title="Send (Enter)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notifications -->
  <div id="toast-wrap" class="toast-wrap"></div>

  <!-- Confetti Canvas -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Section Background Canvases -->
  <canvas id="particles-bg"></canvas>
  <canvas id="about-bg"></canvas>
  <canvas id="skills-bg"></canvas>
  <canvas id="experience-bg"></canvas>
  <canvas id="work-bg"></canvas>
  <canvas id="certs-bg"></canvas>
  <canvas id="contact-bg"></canvas>

  <!-- Scroll to Top Button -->
  <button id="scrolltop" title="Back to top">↑</button>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/interactions.js"></script>
  <script src="js/interactive.js"></script>
  <script src="js/visual.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/ai-agent.js"></script>
</body>
</html>
